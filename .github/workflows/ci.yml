name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: Offline evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          for f in hooks/* scripts/* scripts/lib/* evals/*.sh install/install.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done

      - name: Shellcheck (errors only)
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck not available, skipping"
            exit 0
          fi
          mapfile -t files < <(find hooks scripts evals install -type f \( -name '*.sh' -o -perm -u+x \) | sort)
          shellcheck --severity=error "${files[@]}"

      - name: Run offline suite (79 cases)
        run: bash evals/run.sh

      - name: Run config suite
        run: bash evals/config-evals.sh
